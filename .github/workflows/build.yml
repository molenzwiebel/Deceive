name: Windows Build (.NET 10 Native AOT)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (Native AOT)
        run: dotnet publish Deceive/Deceive.csproj -c Release -o publish

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Deceive
          path: publish/Deceive.exe
